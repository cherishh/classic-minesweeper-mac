<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <title>扫雷 98经典 — 中文商店首尾图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #111; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif; }
    .shot {
      position: relative;
      width: 2880px;
      height: 1800px;
      overflow: hidden;
      color: #0b0b0b;
      background: #f7f7f4;
    }
    .meta {
      position: absolute;
      z-index: 5;
      left: 170px;
      right: 170px;
      top: 116px;
      display: flex;
      justify-content: space-between;
      padding-bottom: 45px;
      border-bottom: 2px solid #d3d3ce;
      color: #777773;
      font: 500 27px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .22em;
    }
    .eyebrow {
      margin: 0 0 48px;
      color: #ff5f35;
      font-size: 35px;
      font-weight: 650;
      letter-spacing: .09em;
    }

    /* 01 — faithful landscape adaptation of the supplied cover. */
    #zh-01 .copy {
      position: absolute;
      z-index: 3;
      left: 170px;
      top: 350px;
      width: 1320px;
    }
    #zh-01 h1 {
      margin: 0;
      font-size: 190px;
      font-weight: 300;
      line-height: 1.03;
      letter-spacing: -.06em;
    }
    .cover-visual {
      position: absolute;
      z-index: 1;
      right: 115px;
      bottom: 80px;
      width: 1240px;
      height: 1410px;
      overflow: hidden;
      background:
        linear-gradient(rgba(50,50,50,.075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(50,50,50,.075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.82), rgba(255,255,255,.35));
      background-size: 96px 96px, 96px 96px, 100% 100%;
    }
    .cover-visual::before {
      content: "";
      position: absolute;
      right: -230px;
      bottom: -310px;
      width: 1050px;
      height: 1050px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,95,53,.95) 0 6px, transparent 7px) 0 0 / 24px 24px,
        linear-gradient(135deg, transparent 24%, rgba(255,95,53,.14) 68%, rgba(0,0,0,.62));
    }
    .cover-visual::after {
      content: "";
      position: absolute;
      left: -165px;
      bottom: -210px;
      width: 720px;
      height: 720px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,0,0,.72) 0 3px, transparent 4px) 0 0 / 18px 18px;
      opacity: .65;
    }
    .product-mat {
      position: absolute;
      z-index: 2;
      left: 245px;
      top: 120px;
      width: 780px;
      height: 1182px;
      padding: 40px;
      background: rgba(255,255,255,.96);
      box-shadow: 28px 34px 0 rgba(0,0,0,.15);
    }
    .product {
      display: block;
      width: 700px;
      image-rendering: pixelated;
    }

    /* 05 — original smiley-led CTA. */
    #zh-05 {
      background:
        linear-gradient(rgba(50,50,50,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(50,50,50,.05) 1px, transparent 1px),
        #f7f7f4;
      background-size: 96px 96px, 96px 96px, 100% 100%;
    }
    #zh-05::after {
      content: "";
      position: absolute;
      right: -300px;
      bottom: -480px;
      width: 1250px;
      height: 1250px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,95,53,.92) 0 7px, transparent 8px) 0 0 / 28px 28px;
      opacity: .72;
    }
    .face-stage {
      position: absolute;
      z-index: 2;
      left: 170px;
      top: 350px;
      width: 920px;
      height: 1100px;
      background: #0b0b0b;
      overflow: hidden;
    }
    .face-stage::before {
      content: "";
      position: absolute;
      left: -220px;
      top: -240px;
      width: 1080px;
      height: 1080px;
      border-radius: 50%;
      background: #ff5f35;
    }
    .face-stage::after {
      content: "";
      position: absolute;
      right: -180px;
      bottom: -180px;
      width: 600px;
      height: 600px;
      border: 3px solid rgba(255,255,255,.35);
      border-radius: 50%;
      box-shadow: 0 0 0 88px rgba(255,255,255,.06), 0 0 0 176px rgba(255,255,255,.04);
    }
    .face {
      position: absolute;
      z-index: 3;
      left: 170px;
      top: 205px;
      width: 580px;
      image-rendering: pixelated;
      filter: drop-shadow(34px 38px 0 rgba(0,0,0,.24));
    }
    .flag-chip {
      position: absolute;
      z-index: 4;
      left: 70px;
      bottom: 72px;
      display: flex;
      align-items: center;
      gap: 22px;
      color: #fff;
      font: 600 29px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .13em;
    }
    .flag-chip img { width: 52px; image-rendering: pixelated; }
    .cta-copy {
      position: absolute;
      z-index: 3;
      left: 1240px;
      top: 410px;
      width: 1380px;
    }
    .cta-copy h1 {
      margin: 0;
      font-size: 250px;
      font-weight: 300;
      line-height: 1.02;
      letter-spacing: -.065em;
    }
    .cta-copy .sub {
      margin: 62px 0 0;
      font-size: 49px;
      font-weight: 400;
      color: #555550;
    }
    .cta-action {
      display: inline-flex;
      align-items: center;
      gap: 24px;
      margin-top: 78px;
      padding: 30px 42px 33px;
      background: #0b0b0b;
      color: #fff;
      font-size: 42px;
      font-weight: 650;
    }
    .cta-action::before {
      content: "";
      width: 22px;
      height: 22px;
      background: #ff5f35;
    }
    .footer {
      position: absolute;
      z-index: 4;
      left: 1240px;
      bottom: 152px;
      color: #777773;
      font: 600 28px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .18em;
    }
  </style>
</head>
<body>
  <main class="shot" id="zh-01">
    <div class="meta"><span>GAME · MAC APP</span><span>2026 · FREE</span></div>
    <section class="copy">
      <p class="eyebrow">开源 · APPLE SILICON</p>
      <h1>把 Win98<br>扫雷<br>搬到 Mac</h1>
    </section>
    <section class="cover-visual" aria-hidden="true">
      <div class="product-mat">
        <img class="product" src="../../source/beginner-one-flag-large.png" alt="">
      </div>
    </section>
  </main>

  <main class="shot" id="zh-05">
    <div class="meta"><span>MINESWEEPER CLASSIC: 98</span><span>05 · READY</span></div>
    <section class="face-stage" aria-hidden="true">
      <img class="face" src="../../../../Resources/RetroAssets/face-neutral.png" alt="">
      <div class="flag-chip"><img src="../../../../Resources/RetroAssets/flag.png" alt=""><span>ONE MORE ROUND</span></div>
    </section>
    <section class="cta-copy">
      <p class="eyebrow">ONE MORE ROUND · 最后一页</p>
      <h1>要不要<br>来一局？</h1>
      <p class="sub">熟悉的笑脸，已经准备好了。</p>
      <div class="cta-action">打开就玩</div>
    </section>
    <div class="footer">完全离线 · 无广告 · 原生 MAC</div>
  </main>
</body>
</html>
